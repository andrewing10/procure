services:
  - type: worker
    name: zhimao-v8-discovery-worker
    runtime: node
    buildCommand: npm install && npx playwright install --force chromium --with-deps
    startCommand: node v8_discovery_worker.js
    envVars:
      - key: GEMINI_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: CATAGENT_API_URL
        value: https://www.procureradar.com
      - key: CATAGENT_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: USE_BRD_SB
        value: "false"
      - key: BRD_SB_WSS
        sync: false
      - key: SKIP_SQLITE
        value: "true"
