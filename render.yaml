services:
  - type: worker
    name: zhimao-v8-discovery-worker
    runtime: node
    numInstances: 3
    buildCommand: npm install
    startCommand: node v8_discovery_worker.js
    envVars:
      # ── LLM ──────────────────────────────────────────────────────────
      - key: GEMINI_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.1-pro-preview"
      - key: GEMINI_FAST_MODEL
        value: "gemini-3.1-flash-lite"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-5.5"
      - key: OPENAI_FAST_MODEL
        value: "gpt-4.1-mini"
      # ── 搜索 ─────────────────────────────────────────────────────────
      - key: SERPER_API_KEY
        sync: false
      # ── 住宅IP代理（BrightData）─────────────────────────────────────
      - key: USE_PROXY
        value: "true"
      - key: BRD_USER
        sync: false
      - key: BRD_PASS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BRD_PROXY
        value: "http://brd.superproxy.io:33335"
      - key: USE_BRD_SB
        value: "false"
      - key: BRD_SB_WSS
        sync: false
      # ── CRM B2 emit（可选，与 zhimao apps/web 一致）────────────────────
      - key: ZHIMAO_APP_URL
        sync: false
      - key: CRM_WATCH_EMIT_SECRET
        sync: false
      - key: DISCOVERY_COMPLETION_NOTIFY
        value: "supabase"
      - key: CRM_WATCH_EMIT_ON_FAILURE
        value: "false"
      # ── 运行模式 ────────────────────────────────────────────────────
      - key: SKIP_SQLITE
        value: "true"
      - key: PLAYWRIGHT_TIMEOUT
        value: "12000"
      - key: STEP3_PAGE_CONCURRENCY
        value: "12"
      - key: STEP1_TIERED
        value: "1"
      - key: STEP1_ENOUGH_HITS
        value: "80"
      - key: STEP3_DEFER_CONTACT
        value: "1"
      # P2-A：enrich 由独立 worker 消费；discovery worker 空闲不再抢队列
      - key: ENRICH_IDLE_IN_DISCOVERY_WORKER
        value: "0"
      # P2-B：Step2 intake 瘦身
      - key: INTAKE_FAST_PATH
        value: "1"
      - key: INTAKE_BATCH_SIZE
        value: "15"
      - key: INTAKE_CONCURRENCY
        value: "6"
      - key: ENRICH_QUEUE_BATCH_SIZE
        value: "20"
      - key: ENRICH_QUEUE_MAX_PER_JOB
        value: "150"
      - key: ENRICH_QUEUE_MAX_RETRIES
        value: "5"
      - key: ENRICH_PROMOTE_SCORE
        value: "70"
      # ── P1-D：原子领单 + cancel LISTEN ──
      - key: DATABASE_URL
        sync: false
      - key: STALE_CLAIM_SECONDS
        value: "900"
      - key: CANCEL_POLL_MS
        value: "3000"
      # ── 税号/工商注册反向验证 ──
      - key: TAX_VERIFY_ENABLED
        value: "false"
      - key: TAX_VERIFY_CONCURRENCY
        value: "3"
      - key: TAX_VERIFY_TIMEOUT_MS
        value: "5000"

  # P2-A：Dedicated Playwright contact 补全（不依赖 discovery job 空闲）
  - type: worker
    name: zhimao-v8-enrichment-worker
    runtime: node
    numInstances: 2
    buildCommand: npm install
    startCommand: node v8_discovery_enrichment_worker.js
    envVars:
      - key: ENRICH_WORKER_DEDICATED
        value: "1"
      - key: ENRICH_POLL_MS
        value: "4000"
      - key: ENRICH_QUEUE_BATCH_SIZE
        value: "20"
      - key: ENRICH_QUEUE_MAX_RETRIES
        value: "5"
      - key: PLAYWRIGHT_TIMEOUT
        value: "12000"
      - key: STEP3_PAGE_CONCURRENCY
        value: "12"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: USE_PROXY
        value: "true"
      - key: BRD_USER
        sync: false
      - key: BRD_PASS
        sync: false
      - key: BRD_PROXY
        value: "http://brd.superproxy.io:33335"
